name: Build, Test & Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*" # Alternative: only build for tags.
  pull_request:

jobs:

  build_wheels_win:
    name: Build wheels for cp${{ matrix.python }}-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # win-64
          - os: windows-latest
            python: 39
            platform_id: win_amd64
          - os: windows-latest
            python: 310
            platform_id: win_amd64
          - os: windows-latest
            python: 311
            platform_id: win_amd64
          - os: windows-latest
            python: 312
            platform_id: win_amd64
          - os: windows-latest
            python: 313
            platform_id: win_amd64
          - os: windows-latest
            python: 313t
            platform_id: win_amd64
            cibw_enable: cpython-freethreading
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Provide gfortran (Windows)
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          update: true
          cache: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-openblas
            mingw-w64-x86_64-gcc-fortran
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pipx run --python 3.13 cibuildwheel==3.1.1
        shell: msys2 {0}
        env:
          CIBW_ARCHS: all
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND_WINDOWS: ""
          UV_INDEX: https://pypi.org/simple
          UV_DEFAULT_INDEX: https://pypi.org/simple
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
      - run: |
          mv  wheelhouse  dist
          pipx run --python 3.13 delvewheel==1.10 repair dist/*.whl -vv
          ls -l wheelhouse/*
          uv sync
          uv pip install wheelhouse/*.whl
          cd .venv
          Scripts/python.exe -m pytest ../tests -vv -s
        shell: msys2 {0}
        env:
          PYTHONIOENCODING: utf-8
      - uses: pypa/cibuildwheel@v3.1.1
        if: runner.os != 'Windows'
        env:
          CIBW_ARCHS: all
          CIBW_BUILD_VERBOSITY: 1
          UV_INDEX: https://pypi.org/simple
          UV_DEFAULT_INDEX: https://pypi.org/simple
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
      - run: ls -l wheelhouse/*
        shell: bash

  build_wheels_nonwin:
    name: Build wheels for cp${{ matrix.python }}-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-64 for manylinux2014
          - os: ubuntu-latest
            python: 39
            platform_id: manylinux_x86_64
            manylinux_image: manylinux2014
          - os: ubuntu-latest
            python: 310
            platform_id: manylinux_x86_64
            manylinux_image: manylinux2014
          - os: ubuntu-latest
            python: 311
            platform_id: manylinux_x86_64
            manylinux_image: manylinux2014
          - os: ubuntu-latest
            python: 312
            platform_id: manylinux_x86_64
            manylinux_image: manylinux2014
          - os: ubuntu-latest
            python: 313
            platform_id: manylinux_x86_64
            manylinux_image: manylinux2014
          - os: ubuntu-latest
            python: 313t
            platform_id: manylinux_x86_64
            cibw_enable: cpython-freethreading
            manylinux_image: manylinux2014
          # linux-aarch64 for manylinux2014
          - os: ubuntu-24.04-arm
            python: 39
            platform_id: manylinux_aarch64
            manylinux_image: manylinux2014
          - os: ubuntu-24.04-arm
            python: 310
            platform_id: manylinux_aarch64
            manylinux_image: manylinux2014
          - os: ubuntu-24.04-arm
            python: 311
            platform_id: manylinux_aarch64
            manylinux_image: manylinux2014
          - os: ubuntu-24.04-arm
            python: 312
            platform_id: manylinux_aarch64
            manylinux_image: manylinux2014
          - os: ubuntu-24.04-arm
            python: 313
            platform_id: manylinux_aarch64
            manylinux_image: manylinux2014
          - os: ubuntu-24.04-arm
            python: 313t
            platform_id: manylinux_aarch64
            cibw_enable: cpython-freethreading
            manylinux_image: manylinux2014
          # linux-64 for manylinux_2_28
          - os: ubuntu-latest
            python: 39
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 310
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 311
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 312
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 313
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 313t
            platform_id: manylinux_x86_64
            cibw_enable: cpython-freethreading
            manylinux_image: manylinux_2_28
          # linux-aarch64 for manylinux_2_28
          - os: ubuntu-24.04-arm
            python: 39
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
          - os: ubuntu-24.04-arm
            python: 310
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
          - os: ubuntu-24.04-arm
            python: 311
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
          - os: ubuntu-24.04-arm
            python: 312
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
          - os: ubuntu-24.04-arm
            python: 313
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
          - os: ubuntu-24.04-arm
            python: 313t
            platform_id: manylinux_aarch64
            cibw_enable: cpython-freethreading
            manylinux_image: manylinux_2_28
          # macos-x86-64
          - os: macos-13
            python: 39
            macos_target: 13
            platform_id: macosx_x86_64
          - os: macos-13
            python: 310
            macos_target: 13
            platform_id: macosx_x86_64
          - os: macos-13
            python: 311
            macos_target: 13
            platform_id: macosx_x86_64
          - os: macos-13
            python: 312
            macos_target: 13
            platform_id: macosx_x86_64
          - os: macos-13
            python: 313
            macos_target: 13
            platform_id: macosx_x86_64
          - os: macos-13
            python: 313t
            macos_target: 13
            platform_id: macosx_x86_64
            cibw_enable: cpython-freethreading
          # macos-arm64
          - os: macos-14
            python: 39
            macos_target: 14
            platform_id: macosx_arm64
          - os: macos-14
            python: 310
            macos_target: 14
            platform_id: macosx_arm64
          - os: macos-14
            python: 311
            macos_target: 14
            platform_id: macosx_arm64
          - os: macos-14
            python: 312
            macos_target: 14
            platform_id: macosx_arm64
          - os: macos-14
            python: 313
            macos_target: 14
            platform_id: macosx_arm64
          - os: macos-14
            python: 313t
            macos_target: 14
            platform_id: macosx_arm64
            cibw_enable: cpython-freethreading
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Provide gfortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: latest
      - uses: pypa/cibuildwheel@v3.1.1
        env:
          CIBW_ARCHS: all
          CIBW_BUILD_VERBOSITY: 1
          UV_INDEX: https://pypi.org/simple
          UV_DEFAULT_INDEX: https://pypi.org/simple
          CIBW_BEFORE_ALL_MACOS: "brew install openblas"
          CIBW_BEFORE_ALL_LINUX: "yum install -y openblas-devel"
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}.0
      - run: ls -l wheelhouse/*
        shell: bash

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels_win, build_wheels_nonwin, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
